      /* Custom Scrollbar */

        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #18181b; 
      }

        background: #404040;

      }

      /* CS2 Smoke/Gradient Effect Background */
      .cs2-bg {
        background: radial-gradient(circle at 50% 0%, rgba(56, 58, 64, 0.4) 0%, rgba(15, 16, 18, 1) 70%);
        position: relative;
        overflow: hidden;
      }
      .cs2-bg::before {
        content: "";
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background-image: 
          linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 40px 40px;
        mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
        pointer-events: none;
        z-index: 0;
      }
    </style>
